<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Heaters Pricing Calculator</title>
    <script>
        // Air Heaters Data Catalog
        const airHeatersData = [
            { partNo: "AH50050R", termination: "36\" High Temp Leads", volts: 120, watts: 400, price: 99.20 },
            { partNo: "AH50050T", termination: "36\" High Temp Leads", volts: 240, watts: 400, price: 99.20 },
            { partNo: "AH50050V", termination: "36\" High Temp Leads", volts: 120, watts: 600, price: 99.20 },
            { partNo: "AH50050X", termination: "36\" High Temp Leads", volts: 240, watts: 600, price: 99.20 },
            { partNo: "AH50050S", termination: "3 pin connector", volts: 120, watts: 400, price: 111.55 },
            { partNo: "AH50050U", termination: "3 pin connector", volts: 240, watts: 400, price: 111.55 },
            { partNo: "AH50050W", termination: "3 pin connector", volts: 120, watts: 600, price: 111.55 },
            { partNo: "AH50050Y", termination: "3 pin connector", volts: 240, watts: 600, price: 111.55 }
        ];

        function updateCatalogSelection() {
            const partSelect = document.getElementById('partNo').value;
            const heater = airHeatersData.find(h => h.partNo === partSelect);

            if (heater) {
                document.getElementById('displayVolts').innerText = heater.volts + ' V';
                document.getElementById('displayWatts').innerText = heater.watts + ' W';
                document.getElementById('displayTerm').innerText = heater.termination;
            }
            calculatePrice();
        }

        function calculatePrice() {
            const partSelect = document.getElementById('partNo').value;
            const heater = airHeatersData.find(h => h.partNo === partSelect);
            let basePrice = heater ? heater.price : 99.20;

            // Fittings options checkboxes
            let fittingsCost = 0;
            if (document.getElementById('inletFitting').checked) fittingsCost += 18.58;
            if (document.getElementById('outletFitting').checked) fittingsCost += 18.58;

            let total = basePrice + fittingsCost;
            document.getElementById('totalPrice').innerText = '$' + total.toFixed(2);
        }

        window.onload = function() {
            updateCatalogSelection();
        }
    </script>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .info-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-item input {
            width: auto;
        }
        .checkbox-item label {
            margin-bottom: 0;
            font-weight: normal;
            font-size: 13px;
        }
        .summary-card {
            background-color: #ebf8ff;
            border: 1px solid #bee3f8;
            border-radius: 6px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }
        .summary-card h2 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            font-size: 18px;
        }
        .total-price {
            font-size: 32px;
            font-weight: bold;
            color: #2b6cb0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Stock Air Heaters Pricing Calculator</h1>


    <div class="form-group">
        <label for="partNo">Select Part Number</label>
        <select id="partNo" onchange="updateCatalogSelection()" oninput="updateCatalogSelection()">
            <option value="AH50050R">AH50050R (120V, 400W, 36" Leads)</option>
            <option value="AH50050T">AH50050T (240V, 400W, 36" Leads)</option>
            <option value="AH50050V">AH50050V (120V, 600W, 36" Leads)</option>
            <option value="AH50050X">AH50050X (240V, 600W, 36" Leads)</option>
            <option value="AH50050S">AH50050S (120V, 400W, 3-Pin Connector)</option>
            <option value="AH50050U">AH50050U (240V, 400W, 3-Pin Connector)</option>
            <option value="AH50050W">AH50050W (120V, 600W, 3-Pin Connector)</option>
            <option value="AH50050Y">AH50050Y (240V, 600W, 3-Pin Connector)</option>
        </select>
    </div>

    <div class="info-box">
        <div class="info-row">
            <strong>Termination Type:</strong> <span id="displayTerm">-</span>
        </div>
        <div class="info-row">
            <strong>Voltage:</strong> <span id="displayVolts">-</span>
        </div>
        <div class="info-row">
            <strong>Wattage:</strong> <span id="displayWatts">-</span>
        </div>
    </div>

    <div class="form-group">
        <label>1/8" FPT or 3/8" MPT Fittings</label>
        <div class="checkbox-grid">
            <div class="checkbox-item">
                <input type="checkbox" id="inletFitting" onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="inletFitting">Inlet Fitting</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="outletFitting" onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="outletFitting">Outlet Fitting</label>
            </div>
        </div>
    </div>

    <div class="summary-card">
        <h2>Estimated Unit Price</h2>
        <div class="total-price" id="totalPrice">$0.00</div>
    </div>
</div>

</body>
</html>
